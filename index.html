<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Микрофон PRO</title><meta name="theme-color" content="#17181b"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#232325;--sf:#2a2a2d;--sh1:#141415;--sh2:#3a3a3e;--tx:#e8e6ea;--mu:#8d8a93;--a:#00e676;--b:#ff2e63;--g:linear-gradient(90deg,#00e676,#ff2e63);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232325}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif}
.app{max-width:440px;margin:0 auto;padding:18px 18px 28px}
h1{margin:6px 0 2px;text-align:center;font-size:30px;letter-spacing:1px;font-weight:900;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #00e67666)}
.sub{text-align:center;color:var(--mu);font-size:12px;margin-bottom:16px;letter-spacing:2px}
.card{background:var(--sf);border-radius:26px;padding:16px;box-shadow:7px 7px 16px var(--sh1),-5px -5px 14px var(--sh2);margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}
canvas{width:100%;height:84px;display:block}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}
#rec.on{color:var(--b)}
.logo{width:46px;height:46px;flex:none;border-radius:50%;background:var(--bg);box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 6px var(--sh2);display:grid;place-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:#111;outline:none;--p:0%;background:linear-gradient(90deg,var(--a),var(--b)) 0/var(--p) 100% no-repeat,#111}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#2d2d31;border:3px solid var(--a);box-shadow:0 0 10px #00e67699}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#2d2d31;border:3px solid var(--a)}
.knobwrap{display:flex;flex-direction:column;align-items:center}
.knob{width:210px;height:210px;touch-action:none;cursor:grab}
.lab{font-size:11px;letter-spacing:2px;color:var(--mu);margin-top:4px}
.btn{border:0;color:var(--tx);background:var(--sf);border-radius:50%;width:56px;height:56px;font:800 15px Montserrat,system-ui;box-shadow:5px 5px 11px var(--sh1),-4px -4px 10px var(--sh2);cursor:pointer;display:grid;place-items:center}
.btn:active{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 6px var(--sh2)}
.btn.act{color:var(--b);box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 6px var(--sh2),0 0 14px #ff2e6355}
.big{width:84px;height:84px;border:3px solid #243a2c}
.big svg{filter:drop-shadow(0 0 6px var(--b))}
.ctrls{display:flex;justify-content:center;gap:34px;align-items:center}
.spd{display:flex;justify-content:center;gap:14px;margin-top:20px}.btn.sm{width:46px;height:46px;font-size:13px}
.tg{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.tg span{font-weight:800;font-size:13px;letter-spacing:1px}
.tg small{display:block;color:var(--mu);font-weight:500;font-size:10px;letter-spacing:0;margin-top:2px}
.sw{width:112px;height:46px;border-radius:30px;background:#18181a;box-shadow:inset 3px 3px 8px var(--sh1),inset -2px -2px 6px var(--sh2);position:relative;cursor:pointer;flex:none}
.sw::before{content:"OFF";position:absolute;right:16px;top:14px;font-size:12px;font-weight:800;color:var(--mu)}
.sw i{position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#3a3a3e,#26262a);box-shadow:3px 3px 7px #0008;transition:.25s}
.sw.on{background:var(--g)}
.sw.on::before{content:"ON";left:18px;right:auto;color:#fff}
.sw.on i{left:71px}
.hint{font-size:11px;color:var(--mu);text-align:center;margin-top:6px}
a.save{color:var(--b);font-size:12px;text-decoration:none;font-weight:700}
.lang{display:flex;justify-content:flex-end;gap:10px}.fl{width:40px;height:30px;padding:4px;border:0;border-radius:9px;background:var(--sf);box-shadow:3px 3px 7px var(--sh1),-3px -3px 7px var(--sh2);opacity:.5;cursor:pointer}.fl.act{opacity:1;box-shadow:inset 2px 2px 5px var(--sh1),inset -2px -2px 5px var(--sh2),0 0 10px #00e67666}.fl svg{width:100%;height:100%;display:block;border-radius:3px}
.tg b{display:block;font-weight:800;font-size:13px;letter-spacing:1px}.sw.dis{opacity:.4}

/* matte glass */
html{background:#07090a}body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(360px 360px at 12% 6%,#00e676cc,transparent 70%),radial-gradient(340px 340px at 95% 38%,#ff2e63aa,transparent 70%),radial-gradient(420px 420px at 10% 92%,#00e67699,transparent 70%),radial-gradient(300px 300px at 85% 85%,#ff2e6388,transparent 70%),#07090a}
body::after{content:"";position:fixed;z-index:-1;width:min(300px,70vw);height:420px;left:50%;top:50%;margin:-210px 0 0 -150px;border-radius:42% 58% 50% 50%/45% 40% 60% 55%;background:radial-gradient(circle at 35% 30%,#0d0f0e,#000 70%);box-shadow:0 0 70px 18px #000,0 0 0 2px #00e67633;pointer-events:none}
.card{background:rgba(255,255,255,.075);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:1px solid rgba(255,255,255,.15);box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.btn{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active,.btn.act{box-shadow:inset 0 3px 9px rgba(0,0,0,.55),0 0 14px #ff2e6344}
.big{border:1px solid rgba(255,255,255,.22)}
.logo{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.35)}
.sw{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 3px 8px rgba(0,0,0,.55)}
.sw i{background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5)}
input[type=range]{background:linear-gradient(90deg,var(--a),var(--b)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8)}
#knob>circle:nth-of-type(1){fill:rgba(0,0,0,.42);stroke:rgba(255,255,255,.14)}
#knob>circle:nth-of-type(2){stroke:rgba(255,255,255,.1)}
#knob>circle:nth-of-type(4){fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.28)}

/* skeuo theme */
.th{width:40px;height:30px;padding:0;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--tx);font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* hw + rk themes */
.dig{display:none}
html.hw body::before,html.hw body::after,html.rk body::before,html.rk body::after{display:none}
html.hw{background:#a9a7a1;--tx:#26251f;--mu:#625f59;--a:#ff5a1f;--b:#ff5a1f}
html.rk{background:#cdcac2;--tx:#26251f;--mu:#6b6862;--a:#e0384a;--b:#e0384a}
html.hw h1,html.rk h1{background:none;filter:none;color:#2b2a26;font:600 24px 'Share Tech Mono',monospace;letter-spacing:3px}
html.rk h1{color:#7d7a73}
html.hw h1::after{content:"";display:block;height:16px;margin:8px 20px 0;background:radial-gradient(circle,#4b4944 2.2px,transparent 2.7px) 0 0/11px 11px}
html.hw .th,html.hw .fl,html.rk .th,html.rk .fl{color:#222;background:linear-gradient(#e6e4de,#bdbbb4);border:1px solid #6f6d68;box-shadow:0 3px 0 #6a6862;-webkit-backdrop-filter:none;backdrop-filter:none}
html.hw .fl.act,html.rk .fl.act{box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 0 0 2px var(--a)}
html.hw .card{position:relative;background:linear-gradient(#b9b7b1,#9f9d97);border:1px solid #d2d0ca;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:none;backdrop-filter:none}
html.hw .card::before,html.hw .card::after{content:"";position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#908e88,#3b3935)}
html.hw .card::after{left:auto;right:8px}
html.rk .card{background:linear-gradient(#e3e0d9,#cac7bf);border:1px solid #f0ede6;border-radius:18px;box-shadow:0 8px 18px rgba(0,0,0,.25),inset 0 1px 0 #fff;-webkit-backdrop-filter:none;backdrop-filter:none}
html.hw .sub+.card,html.rk .sub+.card{background:#0b0b0c;border:2px solid #2b2b2d;box-shadow:inset 0 0 22px #000,0 6px 14px rgba(0,0,0,.35)}
html.hw .sub+.card .time,html.rk .sub+.card .time{color:#86868c}
html.hw .dig,html.rk .dig{display:block;font:600 46px Orbitron,'Share Tech Mono',monospace;letter-spacing:2px;color:#fff;margin:2px 0 6px;text-shadow:0 0 10px rgba(255,255,255,.25)}
html.hw .dig{color:#ff7a3d;text-shadow:0 0 14px #ff5a1f}
html.hw .btn,html.rk .btn{border-radius:14px;color:#222;background:linear-gradient(#e8e6e0,#bfbdb6);border:1px solid #6f6d68;box-shadow:0 5px 0 #6a6862,0 9px 12px rgba(0,0,0,.35),inset 0 1px 0 #fff;-webkit-backdrop-filter:none;backdrop-filter:none}
html.hw .btn:active,html.rk .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #6a6862,inset 0 2px 5px rgba(0,0,0,.3)}
html.hw .btn.act{color:#fff;background:linear-gradient(#ff7a3d,#ff5a1f);box-shadow:0 5px 0 #b13a0e,0 0 14px #ff5a1f88}
html.rk .btn.act{color:#e0384a;background:linear-gradient(#f2f0ec,#d9d6cf);box-shadow:0 5px 0 #6a6862,inset 0 0 0 2px #e0384a}
html.hw #rec{background:linear-gradient(#ff7a3d,#ff5a1f);border-color:#8a2e0c;box-shadow:0 6px 0 #b13a0e,0 10px 16px rgba(0,0,0,.35)}
html.rk #rec{background:linear-gradient(#f6606f,#d92c40);border-color:#8f1a28;box-shadow:0 6px 0 #9c1c2c,0 10px 16px rgba(0,0,0,.35)}
html.hw #play,html.rk #play{background:linear-gradient(#4b4b4b,#2a2a2a);border-color:#111;box-shadow:0 6px 0 #0c0c0c,0 10px 16px rgba(0,0,0,.35)}
html.hw #play svg,html.rk #play svg{fill:#fff;filter:none}
html.hw #rec svg,html.rk #rec svg{filter:none}html.hw #rc,html.rk #rc{fill:#fff;stroke:#fff}
html.hw .logo,html.rk .logo{border-radius:10px;background:#111;border:1px solid #444;box-shadow:inset 0 2px 6px #000}
html.hw .sw,html.rk .sw{border-radius:8px;background:#2a2a2b;border:2px solid #57554f;box-shadow:inset 0 3px 8px #000}
html.hw .sw i,html.rk .sw i{border-radius:5px;background:linear-gradient(#dedad2,#a8a59d);border:1px solid #555;box-shadow:0 2px 0 #444}
html.hw .sw::before,html.rk .sw::before{color:#9a9790}
html.hw .sw.on{background:#2a2a2b;box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #ff5a1f}html.hw .sw.on::before{color:#ff8a52}
html.rk .sw.on{background:#2a2a2b;box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #e0384a}html.rk .sw.on::before{color:#f26a78}
html.hw input[type=range]{height:8px;background:linear-gradient(90deg,#e8e51a,#e8e51a) 0/var(--p) 100% no-repeat,#2a2a2b;box-shadow:inset 0 2px 4px #000}
html.rk input[type=range]{height:8px;background:linear-gradient(90deg,#e0384a,#e0384a) 0/var(--p) 100% no-repeat,#2a2a2b;box-shadow:inset 0 2px 4px #000}
html.hw input[type=range]::-webkit-slider-thumb,html.rk input[type=range]::-webkit-slider-thumb{width:24px;height:18px;border-radius:5px;background:linear-gradient(#f1efe9,#a9a69e);border:1px solid #444;box-shadow:0 2px 0 #333}
html.hw #lg stop,html.hw #kg stop{stop-color:#ff7a3d}html.rk #lg stop,html.rk #kg stop{stop-color:#e0384a}
html.hw #knob>circle:nth-of-type(1),html.rk #knob>circle:nth-of-type(1){fill:#161616;stroke:#555}
html.hw #knob>circle:nth-of-type(2),html.rk #knob>circle:nth-of-type(2){stroke:#3c3c3c}
html.hw #knob>circle:nth-of-type(4){fill:#ff6a2b;stroke:#ffa77a}html.rk #knob>circle:nth-of-type(4){fill:#efede7;stroke:#fff}
html.hw #vv{fill:#fff}html.rk #vv{fill:#26251f}
html.hw #dot circle{fill:#fff}html.rk #dot circle{fill:#e0384a}

/* hw darker */
html.hw{background:#1e1e20;--tx:#ececea;--mu:#a09e98}
html.hw h1{color:#ecebe6}
html.hw h1::after{background:radial-gradient(circle,#6c6a65 2.2px,transparent 2.7px) 0 0/11px 11px}
html.hw .card{background:linear-gradient(#3b3b3e,#28282b);border-color:#555559;box-shadow:0 8px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
/* tape theme */
.cassw{display:none}
html.tp .cassw{display:block;margin:0 0 16px}html.tp .sub+.card{display:none}
.cass{background:linear-gradient(#dadbde,#b5b6ba);border-radius:16px;padding:12px;box-shadow:0 8px 16px rgba(0,0,0,.3),inset 0 1px 0 #fff}
.rl{transform-box:fill-box;transform-origin:center}html.run .rl{animation:sp 1.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
html.tp body::before,html.tp body::after{display:none}
html.tp{background:linear-gradient(90deg,#b4b5b9,#d6d7da 30%,#b1b2b6 62%,#d0d1d4) fixed;--tx:#1b1b1d;--mu:#4a4b50;--a:#d23a2a;--b:#d23a2a}
html.tp h1{background:none;filter:none;color:#222;font:600 20px 'Share Tech Mono',monospace;letter-spacing:4px}
html.tp .th,html.tp .fl{color:#222;background:linear-gradient(#eceded,#bfc0c4);border:1px solid #6f7075;box-shadow:0 3px 0 #77787d;-webkit-backdrop-filter:none;backdrop-filter:none}
html.tp .fl.act{box-shadow:inset 0 2px 4px rgba(0,0,0,.4),0 0 0 2px #d23a2a}
html.tp .card{background:linear-gradient(#dfe0e3,#bdbec2);border:1px solid #f3f3f4;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,.3),inset 0 1px 0 #fff;-webkit-backdrop-filter:none;backdrop-filter:none}
html.tp .sub+.card{background:linear-gradient(#7d9d8f,#65867a);border:10px solid #0d0d0f;border-radius:22px;padding:8px 12px;box-shadow:inset 0 0 30px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.4)}
html.tp .sub+.card .time{color:#1b3a2d}
html.tp .dig{display:block;font:600 42px Orbitron,'Share Tech Mono',monospace;letter-spacing:2px;color:#0f1f18;margin:0 0 4px;text-shadow:1px 1px 0 rgba(255,255,255,.18)}
html.tp .btn{color:#f2f2f2;border-radius:10px;background:linear-gradient(#36363c,#161619);border:1px solid #000;box-shadow:0 4px 0 #050505,0 8px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:none;backdrop-filter:none}
html.tp .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
html.tp .btn.act{color:#ff6a58;box-shadow:0 4px 0 #050505,inset 0 -3px 0 #d23a2a}
html.tp #rec{width:150px;height:62px;border-radius:40px;background:#0c0c0d;border:3px solid #f0f0f0;box-shadow:0 0 0 3px #0c0c0d,0 6px 10px rgba(0,0,0,.4)}
html.tp #rec svg{filter:none}html.tp #rc{fill:#d23a2a;stroke:#d23a2a}
html.tp #play{width:98px;height:98px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2c2c30,#050505);border:3px solid #f0f0f0;box-shadow:0 0 0 3px #0c0c0d,0 6px 10px rgba(0,0,0,.4)}
html.tp #play svg{fill:#fff;filter:none}
html.tp .logo{background:#111;border:1px solid #555;box-shadow:inset 0 2px 6px #000}html.tp #lg stop{stop-color:#fff}
html.tp .sw{border-radius:20px;background:#111;border:2px solid #6a6b70;box-shadow:inset 0 3px 8px #000}
html.tp .sw i{background:radial-gradient(circle at 35% 25%,#fff,#aeafb3);border:1px solid #555;box-shadow:0 2px 0 #444}
html.tp .sw::before{color:#8d8e93}html.tp .sw.on{background:#111;box-shadow:inset 0 3px 8px #000,inset 0 0 0 2px #d23a2a}html.tp .sw.on::before{color:#ff7a68}
html.tp input[type=range]{height:7px;background:linear-gradient(90deg,#d23a2a,#d23a2a) 0/var(--p) 100% no-repeat,#111;box-shadow:inset 0 2px 4px #000}
html.tp input[type=range]::-webkit-slider-thumb{width:20px;height:20px;background:radial-gradient(circle at 35% 25%,#fff,#a9aaae);border:2px solid #333}
html.tp #kg stop:first-child{stop-color:#d23a2a}html.tp #kg stop:last-child{stop-color:#fff}
html.tp #knob>circle:nth-of-type(1){fill:#0a0a0b;stroke:#f0f0f0}html.tp #knob>circle:nth-of-type(2){stroke:#2b2b2e}
html.tp #knob>circle:nth-of-type(4){fill:#17171a;stroke:#444}html.tp #vv{fill:#fff}html.tp #dot circle{fill:#fff}

/* tape deck v2: monochrome */
.tlc,.dk{display:none}
html.tp .cc,html.tp .knobwrap,html.tp .skc{display:none}
html.tp{--a:#e8e8ec;--b:#bfc0c4}
html.tp .tlc{display:block;background:#0b0b0c;border:3px solid #19191b;border-radius:14px;padding:8px 10px;box-shadow:inset 0 0 20px #000,0 6px 14px rgba(0,0,0,.35)}
.tlc canvas{width:100%;height:96px;display:block;touch-action:none}
html.tp .dk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 14px}
.dkl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.r1{display:flex;align-items:center;gap:8px;background:#0b0b0c;border-radius:40px;padding:4px;width:max-content;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.stp{width:48px;height:48px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 30%,#2e2e32,#050506);box-shadow:0 0 0 2px #ededee,inset 0 2px 3px rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;flex:none}
.stp i{width:15px;height:15px;background:#fff}
.rcp{width:92px;height:44px;border-radius:30px;border:2px solid #ededee;background:#0c0c0d;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 2px 6px #000}
.rcp b{width:18px;height:18px;border-radius:50%;background:#f4f4f4;box-shadow:0 0 6px rgba(255,255,255,.35)}
.rcp.rec b{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.15}}
.lbs{display:flex;font:700 11px 'Share Tech Mono',monospace;letter-spacing:1px;color:#222}.lbs span:first-child{width:56px;text-align:center}.lbs span:nth-child(2){flex:1;text-align:center;max-width:92px}
.spc{display:flex;gap:4px;background:#0b0b0c;border-radius:30px;padding:4px;width:max-content;margin-top:8px;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.spc button{width:38px;height:38px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 28%,#3a3a40,#0f0f11);color:#f0f0f0;font:700 11px 'Share Tech Mono',monospace;cursor:pointer;box-shadow:inset 0 0 0 3px #1a1a1c,inset 0 1px 0 rgba(255,255,255,.2),0 2px 3px rgba(0,0,0,.6)}
.spc button.on{background:radial-gradient(circle at 50% 28%,#fafafa,#b4b5b9);color:#111;box-shadow:inset 0 0 0 3px #8e8f94,0 2px 3px rgba(0,0,0,.6)}
.dp{position:relative;width:196px;height:196px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 28%,#26262a,#050506);box-shadow:0 0 0 3px #e9eaec,0 0 0 6px #0b0b0c,0 12px 20px rgba(0,0,0,.45)}
.dp button{position:absolute;border:0;background:none;color:#f2f2f2;font:700 9px 'Share Tech Mono',monospace;letter-spacing:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
